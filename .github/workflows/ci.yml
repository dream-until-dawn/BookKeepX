# 持续集成：格式与代码检查、类型检查、测试三个任务并行，任一失败即 CI 失败
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 格式与代码检查（Biome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    name: 类型检查（tsc）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @bookkeepx/web build

  test:
    name: 测试（Vitest + PostgreSQL）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookkeepx
          POSTGRES_PASSWORD: bookkeepx-ci
          POSTGRES_DB: bookkeepx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookkeepx -d bookkeepx_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://bookkeepx:bookkeepx-ci@localhost:5432/bookkeepx_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
